name: Alpha Unix build

on: push

jobs:
    build:
        strategy:
            matrix:
                include:
                    - os: macos-latest
                      NAME: macos
                    - os: ubuntu-latest
                      NAME: linux

        runs-on: ${{ matrix.os}}

        env:
            TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
            SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Get version
              id: version
              uses: beaconbrigade/package-json-version@v0.3.2
              with:
                  path: .

            - name: Install cross-rs
              run: cargo install cross

            - name: Build service executable
              if: matrix.NAME == 'linux'
              run: cd platforms/unix/daemon && cargo build --release && cross build --release --target aarch64-unknown-linux-gnu

            - name: Build service executable
              if: matrix.NAME == 'macos'
              run: cd platforms/unix/daemon && cargo build --release

            - name: Rename service executable
              run: cp target/release/coresd target/release/coresd-$(rustc -Vv | grep host | cut -f2 -d' ')

            - name: Install node modules
              run: npm ci

            - name: Install webkit2gtk (ubuntu only)
              if: matrix.NAME == 'linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

            # Build service installer
            - name: Build service installer
              run: npm run build:core

            - name: Remove useless folders
              run: |
                  rm -rf target/release/build
                  rm -rf target/release/deps
                  rm -rf target/release/bundle/appimage/Cores.AppDir
                  npm run rename
              shell: bash

            - name: Install webkit2gtk (ubuntu only)
              if: matrix.NAME == 'linux'
              run: |
                  cd ./target/release/upload
                  zip -r coresd-${{steps.version.outputs.version}}-linux-x64.zip coresd-${{steps.version.outputs.version}}-linux-x64
                  zip -r coresd-${{steps.version.outputs.version}}-linux-arm64.zip coresd-${{steps.version.outputs.version}}-linux-arm64

            # Upload the unpackaged app
            - name: Upload service installer
              uses: actions/upload-artifact@v4
              with:
                  name: "cores-${{matrix.NAME}}-${{runner.arch}}"
                  path: "target/release"

            # Upload the unpackaged app
            - name: Upload service installer
              if: matrix.NAME == 'linux'
              uses: actions/upload-artifact@v4
              with:
                  name: "cores-${{matrix.NAME}}-arm64"
                  path: "target/aarch64-unknown-linux-gnu/release"
