[package]
name = "hardwareinfo"
version = "0.1.0"
edition = "2021"

[dependencies]
netdev = "0.46.0"
sysinfo = "0.39.6"
starship-battery = "0.11.0"
indexmap = "2.2.6"
nvml-wrapper = "0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
uuid = { version = "1.6.1", features = ["v4"] }
directories = "4.0.1"
nix = { version = "0.29.0", features = ["user"] }
chrono = "0.4.41"

[target.'cfg(target_os = "macos")'.dependencies]
macmon = { git = "https://github.com/vladkens/macmon", tag = "v0.7.2" }
mtop-tui = "0.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
anyhow = { version = "1.0.86", features = ["backtrace"] }
regex = "1.10.5"
glob = "0.3.1"
