[package]
name = "coresd"
version = "0.43.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
futures = "0.3"
futures-util = { version = "0.3", default-features = false, features = [
    "sink",
    "std",
] }
headers = "0.4"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.0", features = ["fs", "trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hardwareinfo = { path = "../hardwareinfo" }
simplelog = "0.12"
log = "0.4"
ezrtc = "0.12.0"
wol-rs = "1"
clap = { version = "4.5.23", features = ["derive"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
r2d2_sqlite = "0.35.0"
r2d2 = "0.8.10"
